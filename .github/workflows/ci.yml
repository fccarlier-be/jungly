name: CI

on:
  push:
    branches: [main]
  pull_request:

# Le job `test` ne touche jamais a la prod (aucun secret reel fourni ici).
# Le job `e2e` rejoue la meme suite Playwright que e2e/README.md, mais
# contre une instance NEXT START EPHEMERE demarree dans ce workflow (base
# SQLite et compte seed jetables, jamais la vraie prod) -- ferme le trou que
# laissait un simple `npm run build` : la CI pouvait etre verte alors qu'un
# changement cassait le parcours navigateur reel.
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-placeholder-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000
      PLANTES_VAPID_PUBLIC_KEY: BCiFmzUvBhIhOHZ_ci_placeholder_not_used_in_production
      # Active pour que le build/les tests couvrent les routes du don/echange
      # de boutures -- cle jetable (jamais utilisee en production, voir
      # docker-compose.yml pour la vraie).
      ENABLE_CUTTINGS_MARKETPLACE: "true"
      CUTTINGS_MESSAGE_ENCRYPTION_KEY: Y2ktdGVzdC1rZXktbm90LWZvci1wcm9kLTMyYnl0ZSE=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cache du build Next.js (pas seulement npm/node_modules, deja couvert
      # par cache: npm ci-dessus) -- sans ca, chaque run affichait "No build
      # cache found" et repartait de zero a chaque fois. Cle basee sur le
      # lockfile + le code source : invalide automatiquement si l'un des
      # deux change, restore-keys permet un cache partiel (plus rapide que
      # rien) sinon.
      - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Lint (ESLint)
        run: npm run lint

      # Seuil "critical" plutot que "high" : au 2026-09-11, les seules
      # vulnerabilites "high" existantes sont internes a des dependances
      # directes de Next.js/Prisma eux-memes (postcss embarque par next,
      # deepmerge-ts embarque par @prisma/config), sans correctif disponible
      # sans un saut de version majeure (Next 16, Prisma pre-release) --
      # les faire echouer ici bloquerait la CI en permanence pour un
      # probleme qu'on ne peut pas corriger aujourd'hui. --omit=dev : les
      # vulnerabilites de vitest/vite (tests uniquement) ne concernent
      # jamais le code qui tourne reellement en production.
      - name: Audit des dependances (npm audit)
        run: npm audit --omit=dev --audit-level=critical

      - name: Génère le client Prisma
        run: npx prisma generate

      - name: Vérifie que les migrations s'appliquent proprement
        run: npx prisma migrate deploy

      - name: Tests unitaires (vitest)
        run: npm test

      - name: Build (type-check + compilation Next.js)
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    env:
      DATABASE_URL: file:./e2e-ci.db
      AUTH_SECRET: ci-placeholder-secret-not-used-in-production
      # http, pas https : NEXTAUTH_URL en http => pas de prefixe __Secure-
      # sur les cookies de session, qu'un vrai navigateur (Playwright)
      # refuserait sinon en HTTP simple -- voir e2e/README.md, ce piege
      # n'existe qu'en ciblant la prod en HTTPS depuis une adresse interne.
      NEXTAUTH_URL: http://localhost:3000
      PLANTES_VAPID_PUBLIC_KEY: BCiFmzUvBhIhOHZ_ci_placeholder_not_used_in_production
      SEED_USER_EMAIL: e2e-ci-seed@example.com
      SEED_USER_PASSWORD: CiSeedPassword123!
      E2E_BASE_URL: http://localhost:3000
      E2E_SEED_EMAIL: e2e-ci-seed@example.com
      E2E_SEED_PASSWORD: CiSeedPassword123!
      # photos.spec.ts : pas de volume Docker ici, les fichiers uploades
      # vivent directement sous public/uploads du checkout.
      E2E_UPLOADS_DIR: ${{ github.workspace }}/public/uploads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run build

      - name: Démarre le serveur (instance éphémère)
        run: npm start &

      - name: Attend que le serveur réponde
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/login > /dev/null; then
              echo "Serveur prêt."
              exit 0
            fi
            sleep 1
          done
          echo "Le serveur n'a pas démarré à temps." >&2
          exit 1

      # Navigateur (~300 Mo) cache separement de node_modules/.next : sans
      # ca, chaque run le retelechargeait entierement. Cle basee sur le
      # lockfile (fige la version de @playwright/test, donc du navigateur
      # correspondant) -- sur cache hit, install-deps seul reinstalle les
      # paquets systeme (apt, rapide) sans retelecharger le navigateur.
      - name: Cache des navigateurs Playwright
        id: playwright-cache
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Installe les navigateurs Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Installe les dependances systeme Playwright (navigateur deja en cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Tests E2E (instance éphémère)
        run: npx playwright test

  # Image de l'instance HEBERGEE (jungly-app.fcold.org, VPS OVH), publiee sur
  # GHCR puis tiree par le VPS -- le VPS ne compile rien, et ce qui tourne en
  # production est exactement l'image issue d'un commit dont test + e2e sont
  # verts. Jamais sur une pull request (aucune image publiee pour du code non
  # fusionne). Etiquetee sha-<commit> (a epingler cote VPS : deploiement et
  # retour arriere explicites) et main (derniere image verte, informative).
  # Image generique : aucune cle ni configuration d'instance dedans (la cle
  # VAPID publique est lue au runtime, voir getVapidPublicKey) -- tout vient
  # du .env du VPS, rien n'est stocke cote GitHub.
  image:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/jungly-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: SHA court
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Jungly - image utilisee par l'instance hebergee (jungly-app.fcold.org)
          cache-from: type=gha
          cache-to: type=gha,mode=max
