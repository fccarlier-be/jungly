name: CI

on:
  push:
    branches: [main]
  pull_request:

# N'exécute jamais les tests E2E Playwright (e2e/) ici : ils ciblent
# l'application réellement déployée en HTTPS (voir e2e/README.md), pas une
# instance jetable -- aucun secret de production n'est fourni à ce workflow.
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-placeholder-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: BCiFmzUvBhIhOHZ_ci_placeholder_not_used_in_production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Génère le client Prisma
        run: npx prisma generate

      - name: Vérifie que les migrations s'appliquent proprement
        run: npx prisma migrate deploy

      - name: Tests unitaires (vitest)
        run: npm test

      - name: Build (type-check + compilation Next.js)
        run: npm run build
