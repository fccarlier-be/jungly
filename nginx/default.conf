# $remote_addr ici est l'IP du conteneur cloudflared (le tunnel), pas celle
# du visiteur -- Cloudflare pose systematiquement CF-Connecting-IP (IP
# reelle) sur toute requete passant par son edge, y compris via Tunnel.
# Sans ce repli, tous les visiteurs externes partageaient le meme
# compteur de rate limit cote app (voir src/lib/rateLimit.ts).
map $http_cf_connecting_ip $real_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # /uploads/<nom> n'est plus servi directement par nginx (aucune
    # verification d'acces possible ici) : proxifie vers Next.js comme le
    # reste, une route dediee (src/app/uploads/[filename]/route.ts) verifie
    # que le fichier appartient bien a une plante de l'utilisateur connecte
    # avant de le lire sur disque.
    location / {
        proxy_pass http://plantes-app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        # Ne JAMAIS ecraser avec $scheme ici : cloudflared termine le TLS en
        # amont et transmet deja le bon X-Forwarded-Proto. L'ecraser casse
        # les cookies "secure" de NextAuth (voir memoire
        # cloudflared_secure_cookie_gotcha - incident deja rencontre sur
        # d'autres apps du homelab).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
