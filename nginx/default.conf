server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://plantes-app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ne JAMAIS ecraser avec $scheme ici : cloudflared termine le TLS en
        # amont et transmet deja le bon X-Forwarded-Proto. L'ecraser casse
        # les cookies "secure" de NextAuth (voir memoire
        # cloudflared_secure_cookie_gotcha - incident deja rencontre sur
        # d'autres apps du homelab).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
